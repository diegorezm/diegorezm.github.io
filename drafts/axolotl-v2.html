<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axolote v2</title>
<style>
  :root{
    --paper:#f4efe4; --ink:#2c2a26; --muted:#6f6a60; --rule:#d9d1c1;
    --line:#3b2a2a; --skin:#f7b6c2; --skin-hi:#fcd6de; --gill:#e7708f; --blush:#f2879e;
    --hoodie:#3e4a43; --hoodie-hi:#4f5d55; --strap:#c99a5b; --stick:#8a6a48;
    --water:#9cc7c4; --water-hi:#cfe6e2; --sky-top:#cfe3e6; --sky-bottom:#eef1e2; --hill:#b9cfa0; --hill-near:#9dbb86;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:40px 16px}
  main{max-width:1080px;margin:0 auto}
  h1{font:500 44px/1.05 Georgia,serif;margin:0 0 6px}
  p.lede{color:var(--muted);margin:0 0 32px;max-width:60ch}
  h2{font:500 22px Georgia,serif;margin:40px 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  figure{margin:0;background:#fffaf0;border:1px solid var(--rule);border-radius:16px;padding:12px 12px 10px}
  figure.dark{background:#1f2622;border-color:#33403a}
  figure.dark figcaption{color:#b8c2b9}
  figure svg{display:block;width:100%;height:auto}
  figcaption{font:500 12px/1.3 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .scene{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--rule)}
  .scene svg{display:block;width:100%;height:auto}

  .ol{stroke:var(--line);stroke-width:3.5;stroke-linejoin:round}
  .skin{fill:var(--skin)} .gill{fill:var(--gill)} .hoodie{fill:var(--hoodie)}

  @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
  .wave{transform-origin:124px 114px;animation:wave 1.4s ease-in-out infinite}
  @keyframes gills{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
  .gl{transform-origin:-34px -2px;animation:gills 2.6s ease-in-out infinite}
  .gr{transform-origin:34px -2px;animation:gills 2.6s ease-in-out infinite reverse}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
  .bob{animation:bob 2.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <h1>Axolote, versão 2</h1>
  <p class="lede">Mesmo personagem do Pomolotl: contorno grosso, três brânquias de cada lado,
    mãozinhas redondas, olhos de bolinha e boca em “w”. Aqui ele ganha o moletom escuro e as alças
    da mochila. Repare no contorno escuro em fundo escuro (último card).</p>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Head drawn around (0,0); gills first so the head covers their roots. -->
      <g id="head">
        <g class="gl"><g class="gill ol">
          <ellipse cx="-44" cy="-19" rx="13" ry="5.5" transform="rotate(32 -44 -19)"/>
          <ellipse cx="-48" cy="-5" rx="13.5" ry="5.5" transform="rotate(6 -48 -5)"/>
          <ellipse cx="-45" cy="9" rx="12" ry="5" transform="rotate(-24 -45 9)"/></g></g>
        <g class="gr"><g class="gill ol" transform="scale(-1 1)">
          <ellipse cx="-44" cy="-19" rx="13" ry="5.5" transform="rotate(32 -44 -19)"/>
          <ellipse cx="-48" cy="-5" rx="13.5" ry="5.5" transform="rotate(6 -48 -5)"/>
          <ellipse cx="-45" cy="9" rx="12" ry="5" transform="rotate(-24 -45 9)"/></g></g>
        <ellipse cx="0" cy="0" rx="36" ry="28" class="skin ol"/>
        <ellipse cx="-14" cy="-15" rx="9" ry="4" fill="#fff" opacity=".45"/>
        <ellipse cx="-22" cy="10" rx="5.5" ry="3.2" fill="var(--blush)" opacity=".8"/>
        <ellipse cx="22" cy="10" rx="5.5" ry="3.2" fill="var(--blush)" opacity=".8"/>
        <g class="eye"><circle cx="-16" cy="2" r="3.8" fill="var(--line)"/><circle cx="-14.7" cy=".6" r="1.3" fill="#fff"/></g>
        <g class="eye"><circle cx="16" cy="2" r="3.8" fill="var(--line)"/><circle cx="17.3" cy=".6" r="1.3" fill="#fff"/></g>
        <path d="M-5,10.5 Q0,14.5 5,10.5" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Hood rim that sits behind the head. -->
      <g id="hood"><path d="M-38,4 Q-42,30 0,34 Q42,30 38,4 Q30,24 0,26 Q-30,24 -38,4 Z" class="hoodie ol"/></g>

      <!-- Hoodie torso, straps and drawstrings, centred on (100,124). -->
      <g id="torso">
        <path d="M124,134 C150,140 166,124 160,104 C152,116 142,124 122,120 Z" class="skin ol"/>
        <ellipse cx="83" cy="148" rx="10" ry="5.5" class="skin ol"/>
        <ellipse cx="117" cy="148" rx="10" ry="5.5" class="skin ol"/>
        <ellipse cx="100" cy="124" rx="32" ry="25" class="hoodie ol"/>
        <path d="M86,132 Q100,129 114,132 L116,143 Q100,147 84,143 Z" fill="var(--hoodie-hi)" stroke="var(--line)" stroke-width="2.4" stroke-linejoin="round"/>
        <g stroke-linecap="round" fill="none">
          <path d="M80,104 Q76,120 79,140" stroke="var(--line)" stroke-width="8.5"/>
          <path d="M80,104 Q76,120 79,140" stroke="var(--strap)" stroke-width="4"/>
          <path d="M120,104 Q124,120 121,140" stroke="var(--line)" stroke-width="8.5"/>
          <path d="M120,104 Q124,120 121,140" stroke="var(--strap)" stroke-width="4"/>
        </g>
        <g stroke="#e9e1d1" stroke-width="2" stroke-linecap="round"><path d="M95,103 L94,115"/><path d="M105,103 L106,115"/></g>
        <circle cx="94" cy="116.5" r="2" fill="#e9e1d1"/><circle cx="106" cy="116.5" r="2" fill="#e9e1d1"/>
      </g>

      <!-- Plain pink body, like the Pomolotl app. -->
      <g id="torso-plain">
        <path d="M124,134 C150,140 166,124 160,104 C152,116 142,124 122,120 Z" fill="#ef9fb1" stroke="var(--line)" stroke-width="3.5" stroke-linejoin="round"/>
        <ellipse cx="83" cy="148" rx="10" ry="5.5" class="skin ol"/>
        <ellipse cx="117" cy="148" rx="10" ry="5.5" class="skin ol"/>
        <ellipse cx="100" cy="124" rx="31" ry="24" class="skin ol"/>
        <ellipse cx="100" cy="130" rx="18" ry="14" fill="var(--skin-hi)"/>
      </g>

      <!-- Sleeve: dark outline stroke, then hoodie stroke. -->
      <g id="arm-rest">
        <path d="M78,112 Q66,124 74,134" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/>
        <path d="M78,112 Q66,124 74,134" fill="none" stroke="var(--hoodie)" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="76" cy="136" rx="7" ry="5.5" class="skin ol"/>
      </g>
      <g id="arm-wave">
        <path d="M122,114 Q140,108 146,94" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/>
        <path d="M122,114 Q140,108 146,94" fill="none" stroke="var(--hoodie)" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="147" cy="90" rx="7" ry="7.5" class="skin ol"/>
        <g fill="none" stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round" opacity=".8"><path d="M158,84 q5,6 2,13"/><path d="M165,79 q8,9 3,20"/></g>
      </g>
    </defs>
  </svg>

  <h2>Poses</h2>
  <div class="grid">
    <figure>
      <svg viewBox="0 0 200 170" role="img" aria-label="Axolote acenando">
        <ellipse cx="100" cy="153" rx="50" ry="6" fill="var(--line)" opacity=".12"/>
        <g class="bob">
          <use href="#torso"/>
          <use href="#arm-rest"/>
          <g transform="translate(100 72)"><use href="#hood"/><use href="#head"/></g>
          <g class="wave"><use href="#arm-wave"/></g>
        </g>
      </svg>
      <figcaption>Acenando (hero)</figcaption>
    </figure>

    <figure>
      <svg viewBox="0 0 200 170" role="img" aria-label="Axolote de mochila com cajado">
        <ellipse cx="100" cy="153" rx="50" ry="6" fill="var(--line)" opacity=".12"/>
        <!-- backpack peeking out behind the left shoulder -->
        <rect x="54" y="94" width="34" height="44" rx="10" fill="var(--strap)" stroke="var(--line)" stroke-width="3.5"/>
        <path d="M58,104 H84" stroke="var(--line)" stroke-width="2.4"/>
        <use href="#torso"/>
        <use href="#arm-rest"/>
        <g transform="translate(100 72)"><use href="#hood"/><use href="#head"/></g>
        <!-- walking stick -->
        <path d="M152,66 L142,152" stroke="var(--line)" stroke-width="9" stroke-linecap="round"/>
        <path d="M152,66 L142,152" stroke="var(--stick)" stroke-width="4" stroke-linecap="round"/>
        <path d="M122,116 Q136,116 146,112" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/>
        <path d="M122,116 Q136,116 146,112" fill="none" stroke="var(--hoodie)" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="148" cy="110" rx="7.5" ry="7" class="skin ol"/>
      </svg>
      <figcaption>Trilha (roadmap)</figcaption>
    </figure>

    <figure>
      <svg viewBox="0 0 200 170" role="img" aria-label="Axolote nadando">
        <ellipse cx="100" cy="126" rx="78" ry="16" fill="var(--water-hi)" opacity=".7"/>
        <g class="bob">
          <ellipse cx="100" cy="122" rx="30" ry="18" class="hoodie ol"/>
          <g transform="translate(100 86)"><use href="#hood"/><use href="#head"/></g>
        </g>
        <path d="M30,124 Q100,148 170,124 Q100,138 30,124 Z" fill="var(--water)"/>
        <ellipse cx="100" cy="130" rx="64" ry="11" fill="var(--water)" stroke="var(--line)" stroke-width="3"/>
        <ellipse cx="62" cy="126" rx="7.5" ry="5" class="skin ol"/>
        <ellipse cx="138" cy="126" rx="7.5" ry="5" class="skin ol"/>
        <g fill="none" stroke="var(--water-hi)" stroke-width="2.4" stroke-linecap="round">
          <path d="M44,132 q8,3 16,0"/><path d="M142,133 q8,3 16,0"/></g>
      </svg>
      <figcaption>Nadando (rodapé)</figcaption>
    </figure>

    <figure>
      <svg viewBox="-70 -46 140 92" role="img" aria-label="Cabeça do axolote">
        <use href="#head"/>
      </svg>
      <figcaption>Cabeça (favicon)</figcaption>
    </figure>

    <figure>
      <svg viewBox="0 0 200 170" role="img" aria-label="Axolote rosa sem moletom">
        <ellipse cx="100" cy="153" rx="50" ry="6" fill="var(--line)" opacity=".12"/>
        <g class="bob">
          <use href="#torso-plain"/>
          <ellipse cx="78" cy="128" rx="7" ry="5.5" class="skin ol"/>
          <g transform="translate(100 72)"><use href="#head"/></g>
          <g class="wave">
            <path d="M122,114 Q140,108 146,94" fill="none" stroke="var(--line)" stroke-width="13" stroke-linecap="round"/>
            <path d="M122,114 Q140,108 146,94" fill="none" stroke="var(--skin)" stroke-width="6" stroke-linecap="round"/>
            <ellipse cx="147" cy="90" rx="7" ry="7.5" class="skin ol"/>
          </g>
        </g>
      </svg>
      <figcaption>Sem moletom (igual ao app)</figcaption>
    </figure>

    <figure class="dark">
      <svg viewBox="0 0 200 170" role="img" aria-label="Axolote acenando em fundo escuro">
        <g class="bob">
          <use href="#torso"/>
          <use href="#arm-rest"/>
          <g transform="translate(100 72)"><use href="#hood"/><use href="#head"/></g>
          <g class="wave"><use href="#arm-wave"/></g>
        </g>
      </svg>
      <figcaption>Tema escuro</figcaption>
    </figure>
  </div>

  <h2>No hero</h2>
  <div class="scene">
    <svg viewBox="0 0 1000 360" role="img" aria-label="Axolote ao lado de um lago numa paisagem">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky-top)"/><stop offset="1" stop-color="var(--sky-bottom)"/></linearGradient></defs>
      <rect width="1000" height="360" fill="url(#sky)"/>
      <path d="M0,230 Q220,170 460,215 T1000,200 V360 H0 Z" fill="var(--hill)"/>
      <path d="M0,290 Q300,250 600,285 T1000,270 V360 H0 Z" fill="var(--hill-near)"/>
      <ellipse cx="640" cy="318" rx="150" ry="24" fill="var(--water)"/>
      <ellipse cx="640" cy="314" rx="120" ry="14" fill="var(--water-hi)" opacity=".6"/>
      <g transform="translate(760 150) scale(.95)">
        <ellipse cx="100" cy="153" rx="50" ry="6" fill="var(--line)" opacity=".12"/>
        <g class="bob">
          <use href="#torso"/>
          <use href="#arm-rest"/>
          <g transform="translate(100 72)"><use href="#hood"/><use href="#head"/></g>
          <g class="wave"><use href="#arm-wave"/></g>
        </g>
      </g>
    </svg>
  </div>
</main>
</body>
</html>
